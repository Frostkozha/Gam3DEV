<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Neon Dash</title>
  <style>
    :root {
      --pink: #ff3fb4;
      --cyan: #47e8ff;
      --gold: #ffc93c;
      --red: #ff4d5e;
      --panel: rgba(14, 6, 34, 0.78);
      --panel-edge: rgba(255, 63, 180, 0.4);
      --ink: #f4eeff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #08031a; color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }

    /* HUD */
    #hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .pill { display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; border-radius: 999px; background: var(--panel);
      border: 1px solid var(--panel-edge); box-shadow: 0 0 18px rgba(255, 63, 180, 0.18); font-weight: 800; font-size: 20px; }
    .coin-ico { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, var(--gold) 45%, #b07800);
      box-shadow: 0 0 10px rgba(255, 201, 60, 0.7); }
    .heart { color: var(--pink); text-shadow: 0 0 8px var(--pink); letter-spacing: 2px; }
    .heart .gone { color: #3a2450; text-shadow: none; }
    #lives.hit { animation: alarm 0.4s ease-in-out 2; }
    #coins.bump { animation: bump 0.2s ease-out; }
    @keyframes bump { 50% { transform: scale(1.15); } }
    @keyframes alarm { 50% { transform: scale(1.2); box-shadow: 0 0 26px var(--red); border-color: var(--red); } }
    #progress { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 54px); left: 50%; transform: translateX(-50%); width: min(60vw, 280px); height: 8px;
      border-radius: 99px; background: rgba(255, 255, 255, 0.12); overflow: hidden; pointer-events: none; }
    #progressFill { height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--pink)); box-shadow: 0 0 10px var(--pink); }

    /* Tutorial */
    #tutorial { position: fixed; left: 50%; bottom: 26%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 14px;
      pointer-events: none; transition: opacity 0.3s; }
    #tutorial.hidden { opacity: 0; }
    .tut-txt { font-size: 28px; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 14px var(--pink), 0 3px 0 #4a0a3a; white-space: nowrap; }
    .hand { width: 52px; height: 52px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 20px var(--pink); animation: swipe 1.4s ease-in-out infinite; }
    @keyframes swipe { 0%, 100% { transform: translateX(-60px); } 50% { transform: translateX(60px); } }

    #popups { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .pop { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 26px; color: var(--gold); text-shadow: 0 2px 0 #5a3a00, 0 0 10px rgba(255, 201, 60, 0.6);
      animation: rise 0.9s ease-out forwards; white-space: nowrap; }
    .pop.bad { color: var(--red); text-shadow: 0 2px 0 #4a0010, 0 0 12px rgba(255, 77, 94, 0.7); }
    @keyframes rise { to { transform: translate(-50%, -180%); opacity: 0; } }
    #flash { position: fixed; inset: 0; background: var(--red); opacity: 0; pointer-events: none; transition: opacity 0.25s; }

    /* Endcard */
    #endcard { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(50, 8, 60, 0.75), rgba(6, 2, 16, 0.94));
      transition: opacity 0.4s; }
    #endcard.hidden { opacity: 0; pointer-events: none; }
    .end-box { text-align: center; padding: 28px 30px; max-width: 86vw; animation: popIn 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
    .end-title { font-size: 36px; font-weight: 900; letter-spacing: 2px; line-height: 1.1; color: #fff; text-shadow: 0 0 20px var(--pink), 0 4px 0 #4a0a3a; }
    #endcard.lose .end-title { text-shadow: 0 0 20px var(--red), 0 4px 0 #4a0010; }
    .end-sub { margin-top: 12px; font-size: 16px; opacity: 0.85; }
    .end-score { margin: 20px auto 0; display: inline-flex; align-items: center; gap: 10px; font-size: 30px; font-weight: 900; }
    .end-btn { margin-top: 26px; padding: 16px 44px; border: none; border-radius: 999px; font: inherit; font-size: 22px; font-weight: 900; letter-spacing: 1.5px; color: #2a0620;
      background: linear-gradient(180deg, #ff9ad8, var(--pink)); box-shadow: 0 6px 0 #9a1a68, 0 0 30px rgba(255, 63, 180, 0.5); cursor: pointer; animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: translateY(-5px); } }
    .end-credit { margin-top: 22px; font-size: 11px; opacity: 0.5; letter-spacing: 1px; }
    @keyframes popIn { from { transform: scale(0.6); opacity: 0; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="lives" class="pill heart"></div>
    <div id="coins" class="pill"><span class="coin-ico"></span><span id="coinTxt">0</span></div>
  </div>
  <div id="progress"><div id="progressFill"></div></div>
  <div id="tutorial"><div class="hand"></div><div class="tut-txt">SWIPE TO DODGE</div></div>
  <div id="popups"></div>
  <div id="flash"></div>
  <div id="endcard" class="hidden">
    <div class="end-box">
      <div class="end-title" id="endTitle"></div>
      <div class="end-sub" id="endSub"></div>
      <div class="end-score"><span class="coin-ico"></span><span id="endCoins">0</span></div>
      <div><button class="end-btn" id="endBtn">PLAY AGAIN</button></div>
      <div class="end-credit">NEON DASH · THREE.JS PORTFOLIO DEMO</div>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
